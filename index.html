<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Core Orders - Online Ordering Portal</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --card-bg: #e5e7eb;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --accent-black: #000000;
      --radius: 20px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      margin: 0;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .logo-box {
      width: 70px;
      height: 70px;
      background-color: var(--accent-black);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 12px 0;
    }

    .divider {
      width: 100%;
      border-bottom: 1px dashed #ccc;
      margin-bottom: 18px;
    }

    /* Category Filters */
    .categories {
      display: flex;
      gap: 6px;
      width: 100%;
      overflow-x: auto;
      padding: 6px;
      background: var(--card-bg);
      border-radius: var(--radius);
      margin-bottom: 12px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    .category-btn {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text-dark);
    }

    .category-btn.active {
      background: var(--accent-black);
      color: #ffffff;
    }

    /* Toolbar / Search */
    .toolbar {
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .search-input {
      border: none;
      background: transparent;
      outline: none;
      width: 55%;
      font-size: 13px;
    }

    /* Product Cards */
    .product-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .product-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #d1d5db;
      flex-shrink: 0;
      cursor: pointer;
    }

    .product-details {
      display: flex;
      flex-direction: column;
    }

    .product-details h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .product-details p {
      margin: 3px 0 0 0;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.2;
    }

    .product-action {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      min-width: 90px;
    }

    .price {
      font-weight: bold;
      font-size: 13px;
    }

    .unit {
      font-size: 10px;
      color: var(--text-muted);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border-radius: 12px;
      padding: 2px 6px;
    }

    .qty-btn {
      border: none;
      background: transparent;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      padding: 0 4px;
    }

    /* Option Selection */
    .option-select-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed #d1d5db;
      padding-top: 6px;
      margin-top: 2px;
    }

    .option-select-container label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .option-select {
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 11px;
      outline: none;
    }

    /* Form & Checkout Section */
    .checkout-section {
      width: 100%;
      margin-top: 25px;
      border-top: 2px solid #e5e7eb;
      padding-top: 15px;
    }

    .checkout-section h2 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 13px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent-black);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Modals Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .modal-content-img {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .close-btn {
      position: absolute;
      top: -35px;
      right: 0;
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 18px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Brand Header -->
  <div class="logo-box">CORE</div>
  <h1>Menu Core</h1>
  <div class="divider"></div>

  <!-- Categories -->
  <div class="categories">
    <button class="category-btn active" onclick="filterCategory('All', event)">All</button>
    <button class="category-btn" onclick="filterCategory('Salad', event)">Salads سلطات</button>
    <button class="category-btn" onclick="filterCategory('Sandwiches', event)">Sandwiches سندويشات</button>
    <button class="category-btn" onclick="filterCategory('Dessert', event)">Desserts حلويات</button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <span id="product-count" style="font-size: 12px; font-weight: 500;">Listing products</span>
    <input type="text" id="search" class="search-input" placeholder="🔍 Search product" onkeyup="searchProducts()">
  </div>

  <!-- Product List -->
  <div class="product-list" id="product-list">
    <!-- Rendered via JS -->
  </div>

  <!-- Checkout Form -->
  <div class="checkout-section">
    <h2>Checkout Details</h2>
    <form id="orderForm" onsubmit="handleOrderSubmit(event)">
      
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" required placeholder="e.g. 07XXXXXXXX">
      </div>

      <div class="form-group">
        <label for="receivingDate">Receiving Date (Future Date) *</label>
        <input type="date" id="receivingDate" required>
      </div>

      <div class="form-group">
        <label for="address">Location Address *</label>
        <input type="text" id="address" required placeholder="City, Street, Building No.">
      </div>

      <div class="form-group">
        <label for="paymentMethod">Payment Method *</label>
        <select id="paymentMethod" required>
          <option value="Cash on Delivery">Cash on Delivery</option>
          <option value="CliQ">CliQ</option>
        </select>
      </div>

      <!-- Total summary -->
      <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin: 15px 0;">
        <span>Total Amount:</span>
        <span id="total-price">JOD 0.00</span>
      </div>

      <button type="submit" class="submit-btn">Submit Order</button>
    </form>
  </div>
</div>

<!-- Image Preview Modal -->
<div id="imageModal" class="modal-overlay" style="display: none;" onclick="closeImageModal()">
  <div class="modal-content-img" onclick="event.stopPropagation()">
    <span class="close-btn" onclick="closeImageModal()">&times;</span>
    <img id="modalImage" src="" alt="Product Preview" style="max-width: 85vw; max-height: 75vh; border-radius: 12px; object-fit: contain; background: #fff;" />
  </div>
</div>

<!-- Order Summary & Confirmation Modal -->
<div id="confirmModal" class="modal-overlay" style="display: none;">
  <div class="modal-box">
    <h3 style="margin-top: 0; font-size: 18px; text-align: center;">Confirm Your Order</h3>
    <div id="confirmDetails" style="max-height: 250px; overflow-y: auto; margin: 15px 0; background: #f9f9f9; padding: 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;"></div>
    
    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
      <button type="button" id="editBtn" onclick="closeConfirmModal()" style="flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc; background: #ffffff; cursor: pointer; font-weight: 600;">Edit Order</button>
      <button type="button" id="confirmBtn" onclick="executeFinalOrder()" style="flex: 1; padding: 10px; border-radius: 10px; border: none; background: #000000; color: #ffffff; cursor: pointer; font-weight: bold;">Proceed</button>
    </div>
  </div>
</div>

    // Desserts
    { id: 28, name: "Lazycake Balls ليزي كيك كرات", category: "Dessert", price: 1.75, desc: "", options: [], img: "Lazycake Balls.jfif" },
    { id: 29, name: "Cheesecake تشيز كيك بارد", category: "Dessert", price: 1.75, desc: "", options: [], img: "Cheesecake.jfif" },
    { id: 30, name: "Baked Cheesecake تشيز كيك مخبوز", category: "Dessert", price: 1.75, desc: "", options: [], img: "Baked Cheesecake.jfif" },
    { id: 31, name: "Brownies بروانيز", category: "Dessert", price: 1.75, desc: "", options: [], img: "Brownies.jfif" },
    { id: 32, name: "Blondies بلوندي", category: "Dessert", price: 1.75, desc: "", options: [], img: "Blondie .jfif" },
    { id: 33, name: "Muffin مافن", category: "Dessert", price: 1.50, desc: "", options: [], img: "Muffin.jfif" }
  ];

  let cart = {}; // Stores { id: { qty, option } }
  let activeCategory = 'All';
  let pendingPayload = null;

  // Set min date to tomorrow
  const dateInput = document.getElementById('receivingDate');
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  dateInput.min = tomorrow.toISOString().split('T')[0];

  function renderProducts(items) {
    const list = document.getElementById('product-list');
    list.innerHTML = '';
    document.getElementById('product-count').innerText = `Listing ${items.length} products`;

    items.forEach(p => {
      const cartItem = cart[p.id] || { qty: 0, option: p.options && p.options.length > 0 ? p.options[0] : '' };
      
      let optionsHTML = '';
      if (p.options && p.options.length > 0) {
        optionsHTML = `
          <div class="option-select-container">
            <label for="opt-${p.id}">Select Choice:</label>
            <select id="opt-${p.id}" class="option-select" onchange="changeOption(${p.id}, this.value)">
              ${p.options.map(opt => `<option value="${opt}" ${cartItem.option === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
          </div>
        `;
      }

      const imgHTML = p.img 
        ? `<img src="${p.img}" class="product-img" alt="${p.name}" onclick="openImageModal('${p.img}')">`
        : `<div class="product-img"></div>`;

      list.innerHTML += `
        <div class="product-card">
          <div class="product-main">
            <div class="product-info">
              ${imgHTML}
              <div class="product-details">
                <h3>${p.name}</h3>
                ${p.desc ? `<p>${p.desc}</p>` : ''}
              </div>
            </div>
            <div class="product-action">
              <div class="price">JOD ${p.price.toFixed(2)}</div>
              <div class="unit">Unit</div>
              <div class="qty-controls">
                <button class="qty-btn" type="button" onclick="updateQty(${p.id}, -1)">-</button>
                <span>${cartItem.qty}</span>
                <button class="qty-btn" type="button" onclick="updateQty(${p.id}, 1)">+</button>
              </div>
            </div>
          </div>
          ${optionsHTML}
        </div>
      `;
    });
  }

  function updateQty(id, change) {
    const p = products.find(item => item.id === id);
    if (!cart[id]) {
      const defaultOption = p.options && p.options.length > 0 ? p.options[0] : '';
      cart[id] = { qty: 0, option: defaultOption };
    }

    cart[id].qty += change;

    if (cart[id].qty <= 0) {
      delete cart[id];
    }

    applyCurrentFilters();
    calculateTotal();
  }

  function changeOption(id, selectedValue) {
    if (cart[id]) {
      cart[id].option = selectedValue;
    } else {
      cart[id] = { qty: 0, option: selectedValue };
    }
  }

  function calculateTotal() {
    let total = 0;
    for (let id in cart) {
      const item = products.find(p => p.id == id);
      total += item.price * cart[id].qty;
    }
    document.getElementById('total-price').innerText = `JOD ${total.toFixed(2)}`;
    return total;
  }

  function filterCategory(cat, event) {
    activeCategory = cat;
    document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
    if (event && event.target) {
      event.target.classList.add('active');
    }
    applyCurrentFilters();
  }

  function searchProducts() {
    applyCurrentFilters();
  }

  function applyCurrentFilters() {
    const query = document.getElementById('search').value.toLowerCase();
    let filtered = products;

    if (activeCategory !== 'All') {
      filtered = filtered.filter(p => {
        const cleanCategory = activeCategory.toLowerCase().replace(/s$/, '');
        return p.category.toLowerCase().includes(cleanCategory);
      });
    }

    if (query) {
      filtered = filtered.filter(p => p.name.toLowerCase().includes(query));
    }

    renderProducts(filtered);
  }

  /* Image Preview Modal Logic */
  function openImageModal(imgSrc) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    modalImg.src = imgSrc;
    modal.style.display = 'flex';
  }

  function closeImageModal() {
    document.getElementById('imageModal').style.display = 'none';
  }

  /* Submission & Order Review Modal Logic */
  function handleOrderSubmit(e) {
    e.preventDefault();
    const total = calculateTotal();
    if (total === 0) {
      alert('Please select at least one item before submitting your order.');
      return;
    }

    let itemsList = [];
    let itemsTextArr = [];
    for (let id in cart) {
      if (cart[id].qty > 0) {
        const item = products.find(p => p.id == id);
        itemsList.push({
          name: item.name,
          price: item.price,
          qty: cart[id].qty,
          option: cart[id].option || ''
        });
        const optText = cart[id].option ? ` (${cart[id].option})` : '';
        itemsTextArr.push(`${item.name}${optText} x${cart[id].qty}`);
      }
    }

    pendingPayload = {
      name: document.getElementById('fullName').value,
      phone: document.getElementById('phone').value,
      date: document.getElementById('receivingDate').value,
      address: document.getElementById('address').value,
      payment: document.getElementById('paymentMethod').value,
      itemsList: itemsList,
      itemsText: itemsTextArr.join('\n'),
      total: total.toFixed(2)
    };

    const summaryHTML = `
      <strong>Customer Name:</strong> ${pendingPayload.name}<br>
      <strong>Phone:</strong> ${pendingPayload.phone}<br>
      <strong>Receiving Date:</strong> ${pendingPayload.date}<br>
      <strong>Address:</strong> ${pendingPayload.address}<br>
      <strong>Payment Method:</strong> ${pendingPayload.payment}<br><hr style="border:0; border-top:1px dashed #ccc; margin:8px 0;">
      <strong>Order Items:</strong><br>${itemsTextArr.join('<br>')}<br><hr style="border:0; border-top:1px dashed #ccc; margin:8px 0;">
      <strong style="font-size: 14px;">Total Amount: JOD ${pendingPayload.total}</strong>
    `;

    document.getElementById('confirmDetails').innerHTML = summaryHTML;
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function closeConfirmModal() {
    document.getElementById('confirmModal').style.display = 'none';
  }

async function executeFinalOrder() {
  if (!pendingPayload) return;

  const confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.innerText = "Generating PDF...";
  confirmBtn.disabled = true;

  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCY04lSBq6HQClRXIJc-rfuSFNSikCXq0_yc5cTk2rA57WwuJOTjRXlD411kk_9rhB/exec";
  const targetWhatsApp = "9627 9709 6976";

  let pdfUrl = "";

  try {
    // Primary request attempt
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(pendingPayload)
    });

    if (response.ok) {
      const result = await response.json();
      if (result && result.pdfUrl) {
        pdfUrl = result.pdfUrl;
      }
    }
  } catch (err) {
    console.warn("Standard fetch restricted by CORS/Redirect, submitting with fallback...", err);
    
    // Fallback attempt with mode: 'no-cors' to ensure data reaches Google Apps Script
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(pendingPayload)
      });
    } catch (fallbackErr) {
      console.error("Fallback submission error:", fallbackErr);
    }
  } finally {
    closeConfirmModal();

    let pdfLinkText = pdfUrl ? `\n\n📄 *Download PDF Invoice:* ${pdfUrl}` : "";

    const waText = encodeURIComponent(
      `*NEW ORDER RECEIVED*\n` +
      `----------------------\n` +
      `*Customer Name:* ${pendingPayload.name}\n` +
      `*Phone:* ${pendingPayload.phone}\n` +
      `*Receiving Date:* ${pendingPayload.date}\n` +
      `*Address:* ${pendingPayload.address}\n` +
      `*Payment Method:* ${pendingPayload.payment}\n\n` +
      `*Order Items:*\n${pendingPayload.itemsText}\n\n` +
      `*Total Amount:* JOD ${pendingPayload.total}` +
      pdfLinkText
    );

    window.open(`https://wa.me/${targetWhatsApp}?text=${waText}`, '_blank');

    confirmBtn.innerText = "Proceed";
    confirmBtn.disabled = false;
  }
}
  // Initial render
  renderProducts(products);
</script>
